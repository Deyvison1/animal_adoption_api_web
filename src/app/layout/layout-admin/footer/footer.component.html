<footer class="app-footer p-d-flex p-jc-between p-ai-center p-p-3">
  <div class="footer-left p-d-flex p-ai-center p-gap-3">
    <img src="assets/logo-footer-dgo.png" alt="Logo Deyvison" class="footer-logo" />
    <div class="footer-info">
      <span class="footer-title">Adoção de animais</span>
      <span class="created-by">criada por {{ companyName | uppercase }}</span>
    </div>
  </div>

  <div class="footer-right p-d-flex p-ai-center p-gap-2">
    <!-- Redes sociais -->
    <div class="social-buttons p-d-flex p-ai-center p-gap-2">
      <button
        pButton
        type="button"
        icon="pi pi-facebook"

      ></button>
      <button
        pButton
        type="button"
        icon="pi pi-instagram"
