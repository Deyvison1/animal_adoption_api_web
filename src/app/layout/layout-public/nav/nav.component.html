<p-menubar [model]="items">
  <ng-template #start>
    <svg width="33" height="35" viewBox="0 0 33 35" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="..." fill="var(--primary-color)" />
    </svg>
  </ng-template>

  <ng-template #item let-item let-root="root">
    <a pRipple class="flex items-center p-menubar-item-link">
      <span>{{ item.label }}</span>
    </a>
  </ng-template>

  <ng-template #end>
    <div class="flex items-center gap-2">
      @if (!isLoggedIn()) {
        <p-button 
          [raised]="true" 
          icon="pi pi-sign-in" 
          (onClick)="redirectToLogin()"
          [rounded]="true"
          [text]="true"
          severity="secondary"
        ></p-button>
      } @else {
        <p-menu #profileMenu [model]="profileItems" popup="true"></p-menu>
        <p-button 
          type="button" 
          icon="pi pi-user" 
          [label]="getNameProfile()"
          (onClick)="toggleProfileMenu($event)"
          [rounded]="true"
          [text]="true"
          severity="secondary"
        ></p-button>
      }
    </div>
  </ng-template>
</p-menubar>
