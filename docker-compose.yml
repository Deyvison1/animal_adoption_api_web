
services:
  angular-app:
    build: .
    container_name: adoption-animal-app
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    networks:
      my-infra-docker:
        aliases:
          - image_api
    volumes:
      - ./certs:/etc/nginx/certs:ro  # monta certificados do host

networks:
  my-infra-docker:
    external: true