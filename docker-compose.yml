services:
  angular-app:
    build: .
    container_name: adoption-animal-app
    restart: unless-stopped

    networks:
      - my-infra-docker

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app-animal-adoption.rule=Host(`app.animal-adoption.com.br`)"
      - "traefik.http.routers.app-animal-adoption.entrypoints=websecure"
      - "traefik.http.routers.app-animal-adoption.tls=true"
      - "traefik.http.routers.app-animal-adoption.tls.certresolver=letsencrypt"
      - "traefik.http.services.app-animal-adoption.loadbalancer.server.port=80"

networks:
  my-infra-docker:
    external: true