events {}

http {
    include       mime.types;
    default_type  application/octet-stream;


    # ============================================================
    # APP - HTTP → HTTPS
    # ============================================================

    server {
        listen 80;
        server_name app.animal-adoption.com.br;

        return 301 https://$host$request_uri;
    }


    # ============================================================
    # APP - HTTPS
    # ============================================================

    server {
        listen 443 ssl;
        server_name app.animal-adoption.com.br;

        ssl_certificate     /etc/nginx/certs/app.animal-adoption.com.br.pem;
        ssl_certificate_key /etc/nginx/certs/app.animal-adoption.com.br-key.pem;

        root /usr/share/nginx/html;
        index index.html;


        # Angular SPA
        location / {
            try_files $uri $uri/ /index.html;
        }


        # API autenticada
        location /api/ {
            proxy_pass http://api_animal_adoption:8083/api/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }


        # API pública
        location /public/ {
            proxy_pass http://api_animal_adoption:8083/public/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }


        # Image API
        location /images/ {
            proxy_pass http://image-api:8082/images/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }


    # ============================================================
    # KEYCLOAK - HTTP → HTTPS
    # ============================================================

    server {
        listen 80;
        server_name keycloak.animal-adoption.com.br;

        return 301 https://$host$request_uri;
    }


    # ============================================================
    # KEYCLOAK - HTTPS → HTTP INTERNO
    # ============================================================

    server {
        listen 443 ssl;
        server_name keycloak.animal-adoption.com.br;

        ssl_certificate     /etc/nginx/certs/keycloak.animal-adoption.com.br.pem;
        ssl_certificate_key /etc/nginx/certs/keycloak.animal-adoption.com.br-key.pem;


        location / {
            proxy_pass http://keycloak:8080;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Importante para o Keycloak saber que o acesso externo é HTTPS
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;

            # WebSocket / conexões persistentes
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}