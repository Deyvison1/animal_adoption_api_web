events {}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # 🔵 HTTPS Server - Angular + APIs
    server {
        listen 443 ssl http2;  # HTTP/2 correto
        server_name animal-adoption.com.br www.animal-adoption.com.br;

        # Certificados Let's Encrypt
        ssl_certificate     /etc/letsencrypt/live/animal-adoption.com.br/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/animal-adoption.com.br/privkey.pem;
        include             /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

        root /usr/share/nginx/html;
        index index.html;

        # SPA Angular
        location / {
            try_files $uri $uri/ /index.html;
        }

        # PROXY → API AUTENTICADA
        location /api/ {
            proxy_pass http://api_animal_adoption:8081/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # PROXY → PUBLIC
        location /public/ {
            proxy_pass http://api_animal_adoption:8081/public/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 🔵 PROXY → IMAGE API
        location /images/ {
            proxy_pass http://image-api:8082/images/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 🔵 PROXY → FUTURO KEYCLOAK
        # Se quiser colocar Keycloak sem derrubar ele, pode usar algo assim:
        # location /auth/ {
        #     proxy_pass http://127.0.0.1:8080/;  # Keycloak rodando interno
        #     proxy_http_version 1.1;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        # }
    }

    # 🔴 HTTP → HTTPS REDIRECT
    server {
        listen 80;
        server_name animal-adoption.com.br www.animal-adoption.com.br;
        return 301 https://$host$request_uri;
    }
}
